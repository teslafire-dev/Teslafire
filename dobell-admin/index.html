<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dobell Industrial Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-[#0F172A] text-white min-h-screen flex items-center justify-center p-10 select-none overflow-hidden">
    
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-orange-500 via-yellow-500 to-orange-500"></div>

    <div class="w-full max-w-2xl flex flex-col gap-10">
        
        <!-- Header -->
        <div class="flex flex-col items-center gap-4 text-center">
            <div class="w-20 h-20 bg-orange-500/20 rounded-3xl flex items-center justify-center border border-orange-500/30">
                <svg class="w-10 h-10 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v4M7 7h10"></path></svg>
            </div>
            <h1 class="text-5xl font-black uppercase tracking-tighter">Dobell <span class="text-orange-500">Admin</span></h1>
            <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px]">Gestor de Inventario Inteligente (v1.0)</p>
        </div>

        <!-- Buttons Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-4">
            
            <!-- Descargar Button -->
            <button id="btn-export" class="glass group p-8 rounded-[2.5rem] border border-white/10 hover:border-orange-500/50 transition-all duration-500 flex flex-col gap-4 text-left relative overflow-hidden active:scale-95">
                <div class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center group-hover:bg-orange-500/50 transition-smooth">
                    <svg class="w-6 h-6 text-orange-500 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </div>
                <div>
                    <h3 class="text-xl font-black uppercase tracking-tighter">Descargar Excel</h3>
                    <p class="text-slate-500 text-[9px] font-bold uppercase tracking-widest mt-1">Refrescar Dashboard</p>
                </div>
                <div class="absolute -bottom-4 -right-4 w-24 h-24 bg-orange-500/5 rounded-full blur-2xl group-hover:bg-orange-500/10"></div>
            </button>

            <!-- Sincronizar Button -->
            <button id="btn-import" class="glass group p-8 rounded-[2.5rem] border border-white/10 hover:border-green-500/50 transition-all duration-500 flex flex-col gap-4 text-left relative overflow-hidden active:scale-95">
                <div class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center group-hover:bg-green-500/50 transition-smooth">
                    <svg class="w-6 h-6 text-green-500 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </div>
                <div>
                    <h3 class="text-xl font-black uppercase tracking-tighter">Sincronizar Web</h3>
                    <p class="text-slate-500 text-[9px] font-bold uppercase tracking-widest mt-1">Subir Cambios a la Web</p>
                </div>
                <div class="absolute -bottom-4 -right-4 w-24 h-24 bg-green-500/5 rounded-full blur-2xl group-hover:bg-green-500/10"></div>
            </button>

        </div>

        <!-- Progress Footer -->
        <div id="status-container" class="invisible flex flex-col gap-4 items-center bg-white/5 p-6 rounded-3xl border border-white/5 animate-pulse">
            <span id="status-text" class="text-[10px] font-black uppercase tracking-[0.3em] text-orange-400">Procesando Inventario...</span>
            <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden">
                <div id="progress-bar" class="w-0 h-full bg-orange-500 transition-all duration-300"></div>
            </div>
        </div>

    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const btnExport = document.getElementById('btn-export');
        const btnImport = document.getElementById('btn-import');
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        const progressBar = document.getElementById('progress-bar');

        const showStatus = (text, isError = false) => {
            statusContainer.classList.remove('invisible');
            statusText.innerText = text;
            statusText.className = `text-[10px] font-black uppercase tracking-[0.3em] ${isError ? 'text-red-500' : 'text-orange-400'}`;
            progressBar.style.width = isError ? '0%' : '100%';
        };

        btnExport.addEventListener('click', async () => {
            showStatus('Buscando productos en la nube...');
            const result = await ipcRenderer.invoke('export-excel');
            if(result.success) {
                showStatus('¡Excel descargado en el Escritorio!');
            } else {
                showStatus('Error: ' + result.error, true);
            }
        });

        btnImport.addEventListener('click', async () => {
            showStatus('Actualizando catálogo en vivo...');
            const result = await ipcRenderer.invoke('import-excel');
            if(result.success) {
                showStatus(`¡Listo! ${result.count} productos actualizados.`);
            } else {
                showStatus('Error: ' + result.error, true);
            }
        });
    </script>
</body>
</html>
